version: 2

project_name: hello-cargo

builds:
  - builder: rust
    binary: hello-cargo
    command: build
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-pc-windows-gnu
    flags:
      - --release
    env:
      - CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_x86_64"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  sort: asc
